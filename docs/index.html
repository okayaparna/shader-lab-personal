<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dynamic Shader Generator Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page">
      <aside class="panel">
        <header class="panel-header">
          <div class="brand">
            <img src="./assets/ash-wordmark.svg" alt="Ash" width="57" height="27" />
            <span>· Shader lab</span>
          </div>
          <button id="resetButton" class="reset-button" type="button">Reset</button>
        </header>

        <section class="field">
          <label class="field-title" for="screen1Intent">Intent<span>Screen 1</span></label>
          <div class="select-wrap">
            <select id="screen1Intent"></select>
          </div>
        </section>

        <section class="field">
          <div class="field-title">Topics<span>Screen 2</span></div>
          <div id="screen2Options" class="chip-grid"></div>
        </section>

        <section class="field">
          <div class="field-title">Tone<span>Screen 3</span></div>
          <div id="screen3Options" class="chip-grid"></div>
        </section>

        <section class="field">
          <div class="field-title">Interests<span>Screen 4</span></div>
          <div id="screen4Options" class="chip-grid"></div>
        </section>

        <section class="row">
          <div class="field">
            <label class="field-title" for="accentColor">Accent</label>
            <label class="color-pill">
              <input id="accentColor" type="color" value="#f06d45" />
              <span id="accentHex">#F06D45</span>
            </label>
          </div>
          <div class="field">
            <label class="field-title" for="seed">Seed</label>
            <input id="seed" type="text" placeholder="user-42" autocomplete="off" />
          </div>
        </section>
      </aside>

      <main class="stage">
        <figure class="screen-card">
          <span class="card-tag">Live preview</span>
          <div class="phone-screen">
            <canvas id="shader-canvas" aria-label="Shader preview"></canvas>
            <div class="status-bar" aria-hidden="true">
              <span class="status-time">9:41</span>
              <span class="island"><i></i></span>
              <span class="status-icons">
                <svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx="0.8"/><rect x="5" y="5" width="3" height="6" rx="0.8"/><rect x="10" y="2.5" width="3" height="8.5" rx="0.8"/><rect x="15" y="0" width="3" height="11" rx="0.8"/></svg>
                <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.1A10 10 0 0 0 8 .6 10 10 0 0 0 .9 3.5L2 4.6a8.4 8.4 0 0 1 6-2.4Zm0 3.2c1.4 0 2.6.5 3.6 1.4l1.1-1.1A6.8 6.8 0 0 0 8 3.8c-1.8 0-3.4.7-4.7 1.9l1.1 1.1c1-.9 2.2-1.4 3.6-1.4Zm0 3.2c-.5 0-1 .2-1.4.6L8 10.6l1.4-1.4c-.4-.4-.9-.6-1.4-.6Z"/></svg>
                <svg width="26" height="12" viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" stroke-opacity="0.4"/><rect x="2" y="2" width="19" height="8" rx="2"/><path d="M24 4v4c.8-.3 1.3-1.1 1.3-2S24.8 4.3 24 4Z" fill-opacity="0.4"/></svg>
              </span>
            </div>
          </div>
        </figure>
      </main>
    </div>

    <script src="./app.js"></script>
    <script>
      (() => {
        const color = document.getElementById("accentColor");
        const hex = document.getElementById("accentHex");
        const sync = () => {
          hex.textContent = color.value.toUpperCase();
                  };
        color.addEventListener("input", sync);
        sync();
      })();
    </script>
  </body>
</html>
